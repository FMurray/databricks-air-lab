# AIR usage dashboard: GPU-hours over time by capacity (reserved / on-demand), accelerator, workload shape and usage
# policy, read straight from system tables.
#
#   cd bundles/air-usage-dashboard
#   ./manage.sh deploy -p <profile> --var warehouse_id=<id>     # or databricks bundle deploy, same flags
#
# Deployed like bundles/workspace-notebooks: one user target, the host comes from the profile, so nothing
# workspace-specific is committed. The dashboard is created in /Workspace/Users/<you>/ and published.
#
# The dashboard JSON is built from utils/billing/air_gpu_usage.sql by build_dashboard.py. Edit the SQL, rebuild,
# then deploy. A deploy overwrites edits made to the dashboard in the workspace (the CLI warns first).
bundle:
  name: air-lab-usage-dashboard
  # Same floor as workspace-notebooks; the offline test runs with whichever CLI you point it at.
  databricks_cli_version: ">= 1.20.0"

variables:
  warehouse_id:
    description: ID of the SQL warehouse the dashboard queries run on (Serverless recommended). Required.

# Only the dashboard file is needed; nothing else in this folder is uploaded.
sync:
  include: []
  exclude:
    - "**"

resources:
  dashboards:
    air_gpu_usage:
      display_name: AIR GPU usage
      file_path: ./src/air_gpu_usage.lvdash.json
      warehouse_id: ${var.warehouse_id}
      # Next to your user folder rather than in the hidden bundle folder, so it's easy to find. Not inside
      # databricks-air-lab/, which workspace-notebooks' `manage.sh remove` deletes.
      parent_path: /Workspace/Users/${workspace.current_user.userName}
      # Viewers query with their own credentials, so each needs SELECT on the system tables. Embedding the
      # publisher's credentials would show account-wide billing and audit data to anyone it's shared with.
      embed_credentials: false

targets:
  user:
    default: true
    # Not mode: development, which would prefix the dashboard name with "[dev <you>]".
