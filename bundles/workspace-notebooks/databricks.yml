# Workspace notebooks: copy this repo's workspace-side notebooks into your own workspace folder.
#
#   cd bundles/workspace-notebooks
#   databricks bundle deploy -p <profile>      # or ./manage.sh deploy -p <profile>
#
# Files land under /Workspace/Users/<you>/databricks-air-lab/, mirroring the repo layout, e.g.
# .../databricks-air-lab/utils/billing/reserved_gpu_attribution (a SQL notebook). Needs no
# /Workspace/Shared and no Git folder. The host comes from the profile, so nothing
# workspace-specific is committed here.
#
# Sync is one way, laptop -> workspace: a deploy overwrites edits made to these copies in the
# workspace, and removes files deleted from the listed folders. Save your own changes under another name.
bundle:
  name: air-lab-notebooks
  # Tested with 1.20.0 (what the customer laptop has) and 1.25. The direct-engine deployment state
  # format last changed in 1.17.0, so any CLI from 1.20 on can deploy the same target.
  databricks_cli_version: ">= 1.20.0"

workspace:
  # Where the notebooks go; change it here to deploy elsewhere. Spelled out rather than `~/...`:
  # CLI 1.20 expands `~` in root_path only, so a `~` here would stay literal.
  file_path: /Workspace/Users/${workspace.current_user.userName}/databricks-air-lab
  # Deployment state stays in the default hidden folder (~/.bundle/air-lab-notebooks/<target>).

# Folders to copy, relative to this file. Listing folders outside this directory makes the repo root
# the sync root, so the workspace copy keeps the repo's paths. .gitignore applies: docs/private/ and
# __pycache__/ are never uploaded. Source-format notebooks (`# Databricks notebook source`,
# `-- Databricks notebook source`) become notebooks; other files become workspace files.
#
# Not listed yet: utils/verification/uat-notebooks/ (several hard-code /Workspace/Shared/..., which
# the customer workspace doesn't have).
sync:
  paths:
    - ../../utils/billing

targets:
  user:
    default: true
    # Personal deployment: development mode requires paths under ~/ (or containing your username).
    mode: development
