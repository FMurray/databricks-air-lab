bundle:
  name: air-rdma-recipes
  databricks_cli_version: ">= 1.6.0"

# Make the repository root the common sync root so the tgz can package the
# existing recipe implementations without copying them into this bundle.
sync:
  paths:
    - .
    - ../../experiments/node-acceptance
    - ../../experiments/rdma-stress

artifacts:
  rdma_recipe_code:
    type: tgz
    path: ../..
    include:
      - experiments/node-acceptance/nccl_allreduce_ctypes.py
      - experiments/node-acceptance/vendor
      - experiments/rdma-stress/build_and_run_nccl_tests.sh
      - experiments/rdma-stress/nccl-tests-src
      - experiments/rdma-stress/parambench_probe.py
    files:
      - source: ./dist/rdma-recipes.tgz

resources:
  jobs:
    rdma_m1_soak:
      name: air-lab-rdma-m1-soak
      max_concurrent_runs: 1
      tasks:
        - task_key: rdma_m1_soak
          environment_key: air_v5
          max_retries: 0
          timeout_seconds: 2700
          ai_runtime_task:
            experiment: /Users/${workspace.current_user.userName}/air-lab-rdma-stress
            mlflow_run: rdma-m1-soak
            code_source_path: ./dist/rdma-recipes.tgz
            deployments:
              - name: rdma-m1-soak
                command_path: ./commands/rdma-m1-soak.sh
                compute:
                  accelerator_type: GPU_8xH100
                  accelerator_count: 16
      environments:
        - environment_key: air_v5
          spec:
            environment_version: "5"
            dependencies: []

    rdma_m2a_fabric_only:
      name: air-lab-rdma-m2a-fabric-only
      max_concurrent_runs: 1
      tasks:
        - task_key: rdma_m2a_fabric_only
          environment_key: air_v5
          max_retries: 0
          timeout_seconds: 2700
          ai_runtime_task:
            experiment: /Users/${workspace.current_user.userName}/air-lab-rdma-stress
            mlflow_run: rdma-m2a-fabric-only
            code_source_path: ./dist/rdma-recipes.tgz
            deployments:
              - name: rdma-m2a-fabric-only
                command_path: ./commands/rdma-m2a-fabric-only.sh
                compute:
                  accelerator_type: GPU_8xH100
                  accelerator_count: 32
      environments:
        - environment_key: air_v5
          spec:
            environment_version: "5"
            dependencies: []

    rdma_m2b_p2p_ring:
