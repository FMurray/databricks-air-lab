            mlflow_run: rdma-m2b-p2p-ring
            code_source_path: ./dist/rdma-recipes.tgz
            deployments:
              - name: rdma-m2b-p2p-ring
                command_path: ./commands/rdma-m2b-p2p-ring.sh
                compute:
                  accelerator_type: GPU_8xH100
                  accelerator_count: 32
      environments:
        - environment_key: air_v5
