# Multi-node NCCL probe = the UAT allreduce (open-q #2 scheduling, #3 env plumbing, RDMA
# bandwidth). probe_multinode.sh torchrun-launches allreduce_probe.py — there is no separate
# allreduce workload in the multinode suite. Size-sweep NVLink bench is nccl-allreduce.example.yaml
# (allreduce-single, single-node); ctypes/RDMA isolation is the fabric tier.
# Multinode silently PuPr'd 2026-07-17 (#research-on-air). Earlier guidance said multiples of
# 8xH100 only; 2xA10 is now verified on the native ai_runtime_task path (2026-09-14, run
# 1090461481669184). A10 proves orchestration/correctness but uses socket transport, not EFA.
# H100:  as-is (2 nodes × 8xH100) — uat headline allreduce-fabric.
# A10:   --override compute.accelerator_type=GPU_1xA10 compute.num_accelerators=2
#        — uat plumbing multinode-probe.
experiment_name: air-lab-multinode-probe

environment:
  version: "5"   # v4 job-plane egress broken on hardened ws — see docs/06
  dependencies: []   # schema: version requires dependencies; torch is preinstalled

compute:
  num_accelerators: 16
  accelerator_type: GPU_8xH100

code_source:
  type: snapshot
  snapshot:
    root_path: ..    # relative to THIS YAML's directory, not CWD
    include_paths:
      - experiments/foundation-models/multinode/

command: bash $CODE_SOURCE_PATH/experiments/foundation-models/multinode/probe_multinode.sh

max_retries: 0
timeout_minutes: 30
mlflow_run_name: multinode-probe
