# UAT W-vendor variant B: dependencies staged once in a UC Volume, PYTHONPATH at run.
# ⛔ Gated on the catalog bucket fix (docs/06 ask #1) — volume I/O 403s until then.
# One-time staging (after vendor_deps.sh):
#   databricks fs cp -r experiments/env-flexibility/vendored-wheels/vendor \
#     dbfs:/Volumes/mkazia_lw2_catalog_7474656734648830/airlab/deps/vendor -p mkazia-lw2
experiment_name: air-lab-vendored-wheels

environment:
  version: "5"   # v4 job-plane egress broken on hardened ws — see docs/06
  dependencies: []

env_variables:
  VENDOR_PATH: /Volumes/mkazia_lw2_catalog_7474656734648830/airlab/deps/vendor

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - experiments/env-flexibility/vendored-wheels/

command: |
  export PYTHONPATH="$VENDOR_PATH:$PYTHONPATH"
  python $CODE_SOURCE_PATH/experiments/env-flexibility/vendored-wheels/verify_deps.py

max_retries: 0
timeout_minutes: 15
mlflow_run_name: vendored-wheels-ucvolume
