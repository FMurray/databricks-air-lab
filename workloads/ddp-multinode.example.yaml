# Real DDP training loop on AIR — four assertion-gated proofs (the FSDP counterpart).
# Trainer: experiments/foundation-models/ddp/train_ddp.py (self-contained, egress-free).
# Success = rank-0 emits DDP_TRAIN_COMPLETE (Proofs 1+2+3); DDP_SUITE_COMPLETE adds Proof 4
# (checkpoint/resume). Pre-registered success criteria + local pre-flight output:
# experiments/foundation-models/NOTES.md. Schema source of truth: `air -h config`.
#
# This is the data-parallel twin of workloads/fsdp-multinode.example.yaml. DDP keeps a FULL
# replica of the model on every rank and all-reduces gradients — the counterfactual FSDP is
# measured against (open-q #17). The two share model, task, and acceptance-report format so the
# curves compare directly. Headline run: 2x GPU_8xH100, world=16 (proves DDP survives the EFA
# fabric). Smaller shapes are step-downs via --override, not a config to submit by default:
#   API gate  GPU_1xA10 world=1 — env builds with deps []; runtime torch/NCCL + DDP + torch.save
#             API resolve; loop + single-writer checkpoint round-trip. Replication/all-reduce
#             proofs are VACUOUS at world=1 (necessary API gate, NOT the receipt — no
#             DDP_TRAIN_COMPLETE).
#               --override compute.num_accelerators=1 compute.accelerator_type=GPU_1xA10
#   1 node    GPU_8xH100 world=8 — replication/all-reduce/convergence real, single-node (no EFA):
#               --override compute.num_accelerators=8
#   memprobe  (stretch) DDP-OOM baseline — see the memprobe override at the bottom. The FSDP-fit
#             arm lives in the fsdp trainer (workloads/fsdp-multinode.example.yaml).
experiment_name: air-lab-ddp-multinode

environment:
  version: "5"          # MANDATORY: v4 silently breaks GPU jobs (07); v5 ships the runtime
                        # torch/NCCL + the root-storage log-shipping fix. DDP is torch core, not
                        # FSDP2 — if it is absent on v5 that is a finding to report.
  dependencies: []      # torch is preinstalled; the trainer is self-contained (no PyPI/HF egress).

compute:
  num_accelerators: 16           # world=16 across 2 nodes (8/node) — the headline multinode run:
                                 # proves DDP survives the inter-node fabric (EFA). whole-node
                                 # multiples of 8 only. Check node 1: `air logs <id> --node 1`.
  accelerator_type: GPU_8xH100

code_source:
  type: snapshot
  snapshot:
    root_path: ..               # relative to THIS YAML's dir, not CWD
    include_paths:
      - experiments/foundation-models/ddp/

# Multinode torchrun via injected env (open-q #3 closed; --nproc_per_node alone does NOT span
# nodes). --max-restarts=0 isolates the platform's max_retries from torchrun's elastic restart.
command: >-
  /opt/databricks-environments/databricks-ai/bin/torchrun
  --nnodes=$NUM_NODES --node_rank=$NODE_RANK
  --master_addr=$MASTER_ADDR --master_port=$MASTER_PORT
  --nproc_per_node=$LOCAL_WORLD_SIZE --max-restarts=0
  $CODE_SOURCE_PATH/experiments/foundation-models/ddp/train_ddp.py
  --steps 300 --batch 16 --lr 3e-4 --mp

# NOTE: append --proof4 --ckpt-dir /Volumes/<cat>/<schema>/<vol>/ddp-ckpt for the full suite
# (Proof 4). The UC-volume path is BR-2-gated; the trainer gates the save behind a rank-0
# probe-write and marks Proof 4 blocked-on-BR-2 without failing the training receipt. Do NOT point
# --ckpt-dir at /tmp for the max_retries test (open-q #10) — /tmp does not survive a whole-job
# resubmit.

max_retries: 0                  # rungs 1-3. For the open-q #10 test set to 1 and add
                                # env DDP_FAIL_AT_STEP=<n> inline in command (whole-rank exit 137).
timeout_minutes: 30             # PIN from the A10 step time before H100 spend (~2x est. wall-clock).
                                # Name the H100 approver in NOTES.md.
mlflow_run_name: ddp-multinode
# usage_policy_name: omit on e2-demo-field-eng (no air-lab policy → validation fails, open-q #5).

# --- rung 4 (stretch): DDP-OOM baseline (open-q #17) ---
# The ddp arm is the CONTROL that should CUDA-OOM first; the FSDP-fit arm is in the fsdp trainer.
# State-dominated shape: deep+wide, SHORT seq, small batch (so state, not activations, drives OOM).
#   ddp arm:  --override command="torchrun ... train_ddp.py --memprobe \
#               --layers 48 --dim 4096 --heads 32 --seq 16 --batch 1"
# Label host-OOM (exit 137, no traceback) vs CUDA-OOM (DDP_MEMPROBE_CUDA_OOM) in the write-up.
