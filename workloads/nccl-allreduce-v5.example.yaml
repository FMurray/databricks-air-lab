# UAT A2 on env v5: ctypes-NCCL all-reduce across nodes using the image's own
# CUDA 12.9 + libnccl 2.29.7 (works without torch). Default = cheap 2-node A10 dry-run.
# Scale (quota permitting):
#   --override compute.accelerator_type=GPU_8xH100 compute.num_accelerators=128   # 16 nodes
#   --override compute.accelerator_type=GPU_8xH100 compute.num_accelerators=32    # 4 nodes
# RDMA fabric soak (env_variables, combine with the overrides above):
#   STRESS_SECONDS=600  -> sustained all-reduce loop w/ drift + RDMA hw-counter deltas
#   BUF_MB=1024         -> bigger transfers (default 256)
#   FABRIC_ONLY=1       -> 1 GPU/node communicator: every byte crosses EFA (no NVLink dilution)
experiment_name: air-lab-nccl-allreduce

environment:
  version: "5"   # engagement standard; libnccl/cublas/cudart come from the image
  dependencies: []

compute:
  num_accelerators: 2
  accelerator_type: GPU_1xA10

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - experiments/node-acceptance/

command: python $CODE_SOURCE_PATH/experiments/node-acceptance/nccl_allreduce_ctypes.py

max_retries: 0
timeout_minutes: 30
mlflow_run_name: nccl-allreduce-v5
