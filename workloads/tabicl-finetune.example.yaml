# Fine-tune the released TabICL checkpoint on bank-marketing — the realistic customer path.
experiment_name: air-lab-tabicl-finetune

environment:
  version: "5"   # v4 job-plane egress broken on hardened ws — see docs/06
  dependencies:
    - "tabicl[finetune]"
  # env_variables rejected by air v0.1.0 schema — set env inline in `command`

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

code_source:
  type: snapshot
  snapshot:
    root_path: ..    # relative to THIS YAML's directory, not CWD (verified 2026-07-17)
    include_paths:
      - experiments/foundation-models/tabicl/

command: HF_HOME=/tmp/hf python $CODE_SOURCE_PATH/experiments/foundation-models/tabicl/finetune_smoke.py --epochs 10

max_retries: 0
timeout_minutes: 120
# usage_policy_name: air-lab   # must exist in target workspace or validation fails
mlflow_run_name: tabicl-finetune-smoke
