# UCVolumeDataset data-loading probe — three assertion-gated proofs (sharding / caching / num_workers).
# Probe: experiments/dataloading/ucvolume_probe.py (self-contained; rank 0 writes the dataset into
# the UC volume, all ranks read it back via serverless_gpu.data.UCVolumeDataset + DataLoader).
# Pre-registered success criteria + local CPU pre-flight output: experiments/dataloading/NOTES.md.
# Report format: the acceptance-report skill. Schema source of truth: `air -h config`.
#
# WHAT EACH SHAPE PROVES (escalate only as far as the question needs — A10 answers most of it):
#   API gate + core   GPU_1xA10  world=1 num_workers>=2 — THE default below. Non-vacuous: the
#     (this config)   exact-cover assertion runs over world×workers, so one A10 with 4 workers
#                     still proves the worker-axis auto-sharding (UCVOLUME_SHARDING_OK) AND local
#                     caching (UCVOLUME_CACHE_OK). Cross-rank agreement (Check 3) is N/A at world=1,
#                     so the verdict is ACCEPTED WITH CAVEATS and UCVOLUME_DATALOADER_COMPLETE does
#                     NOT print — that line is reserved for the full multi-rank proof.
#   full proof        GPU_8xH100 world=8 — adds cross-RANK partitioning + num_workers agreement;
#                     emits UCVOLUME_DATALOADER_COMPLETE. Whole-node 8xH100 spend — name the
#                     approver in NOTES.md before submitting.
#                       --override compute.num_accelerators=8 compute.accelerator_type=GPU_8xH100
experiment_name: air-lab-dataloading

environment:
  version: "5"          # MANDATORY: v4 silently breaks GPU-job storage egress (07); v5 is verified
                        # healthy. serverless_gpu.data (UCVolumeDataset/DataLoader) + numpy + torch
                        # are preinstalled in the Databricks AI env — no PyPI/HF egress needed.
  dependencies: []      # if serverless_gpu is NOT importable on v5, that is a finding to report.

compute:
  num_accelerators: 1            # A10 world=1 default. torchrun spans procs via injected env below;
  accelerator_type: GPU_1xA10    # on 8xH100 (num_accelerators=8) LOCAL_WORLD_SIZE=8 → world=8.

code_source:
  type: snapshot
  snapshot:
    root_path: ..                # relative to THIS YAML's dir, not CWD
    include_paths:
      - experiments/dataloading/

# torchrun via injected env (open-q #3: --nproc_per_node alone does NOT span nodes; use $NUM_NODES
# / $NODE_RANK / $MASTER_ADDR / $MASTER_PORT / $LOCAL_WORLD_SIZE). --max-restarts=0 isolates the
# platform's max_retries from torchrun's elastic restart.
# ⚠ FILL IN --volume-dir: a WRITABLE UC volume path on the target workspace. The probe writes N
#   files there (probe-guarded: a 403 → BLOCKED-on-BR-2, not a crash) then reads them back.
# PYTHONPATH BRIDGE (verified 2026-08-27, run 838281261554839): serverless_gpu v0.5.22 is installed
# on the image ONLY in the base python (/databricks/python3/.../site-packages), which has no torch;
# serverless_gpu.data (UCVolumeDataset) hard-requires torch, which lives only in the databricks-ai
# venv. Neither interpreter has both by default. Bridging the base site-packages onto the
# torch-having databricks-ai python lets serverless_gpu.data import — and needs NO pip/egress (the
# package is already on the image), which is the no-egress-friendly path. torchrun propagates the
# env var to workers.
command: >-
  PYTHONPATH=/databricks/python3/lib/python3.12/site-packages:$PYTHONPATH
  /opt/databricks-environments/databricks-ai/bin/torchrun
  --nnodes=$NUM_NODES --node_rank=$NODE_RANK
  --master_addr=$MASTER_ADDR --master_port=$MASTER_PORT
  --nproc_per_node=$LOCAL_WORLD_SIZE --max-restarts=0
  $CODE_SOURCE_PATH/experiments/dataloading/ucvolume_probe.py
  --volume-dir /Volumes/<catalog>/<schema>/<volume>/ucvolume-probe
  --files 96 --num-workers 2 --epochs 2 --read-timeout 240
  # --num-workers: 2 proves the worker axis cheaply; docs default is 6. Same value on every rank.
  # --read-timeout: watchdog self-aborts a hung DataLoader/UCVolumeDataset read (exit 1 → v5 ships
  #   logs). Keep it well under timeout_minutes; a CANCELLED run ships NO logs, so never cancel —
  #   let the watchdog or the platform timeout fire.

max_retries: 0
timeout_minutes: 12             # PIN from the A10 run before any H100 spend. Data-loading probe:
                                # short (I/O-bound, no training). Coordinate/announce ≠ a budget.
mlflow_run_name: ucvolume-dataloader
# usage_policy_name: omit on e2-demo-field-eng (no air-lab policy → validation fails, open-q #5).
