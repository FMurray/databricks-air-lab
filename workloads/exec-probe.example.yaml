# Polyglot ladder step 0: probe exec permissions / glibc / egress on an AIR node.
# Cheap by design — A10, minutes. See experiments/multi-language/NOTES.md.
experiment_name: air-lab-exec-probe

environment:
  version: "5"   # v4 job-plane egress broken on hardened ws — see docs/06
  dependencies: []   # schema: version requires an inline dependencies list (air v0.1.0)

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

code_source:
  type: snapshot
  snapshot:
    root_path: ..    # relative to THIS YAML's directory, not CWD (verified 2026-07-17)
    include_paths:
      - experiments/multi-language/probe/

command: bash $CODE_SOURCE_PATH/experiments/multi-language/probe/probe.sh

max_retries: 0
timeout_minutes: 20
mlflow_run_name: exec-probe
