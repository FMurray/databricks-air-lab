# UAT A2: all-reduce bandwidth bench. Default = single node 8xH100 (NVLink numbers);
# inter-node fabric numbers: --override compute.num_accelerators=16
# Cheap plumbing dry-run first: --override compute.accelerator_type=GPU_1xA10 compute.num_accelerators=2
experiment_name: air-lab-nccl-allreduce

environment:
  version: "4"
  dependencies: []

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - experiments/node-acceptance/

# torchrun wiring from AIR-injected env (NUM_NODES/NODE_RANK/MASTER_ADDR|PORT single-node-safe defaults)
command: |
  torchrun --nnodes=${NUM_NODES:-1} --node-rank=${NODE_RANK:-0} \
    --nproc-per-node=${LOCAL_WORLD_SIZE:-8} \
    --master-addr=${MASTER_ADDR:-127.0.0.1} --master-port=${MASTER_PORT:-29500} \
    $CODE_SOURCE_PATH/experiments/node-acceptance/allreduce_bench.py

max_retries: 0
timeout_minutes: 30
mlflow_run_name: nccl-allreduce
