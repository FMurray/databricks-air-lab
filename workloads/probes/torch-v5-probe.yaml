# Probe: is torch usable on env v5 via the image's databricks-ai environment?
# (Default v5 interpreter lacks torch; the AI env lives under /opt/databricks-environments
#  — survey run 96419244890099.) Tries the env's own python, then PYTHONPATH injection.
experiment_name: air-lab-env-diagnostics

environment:
  version: "5"
  dependencies: []

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

code_source:
  type: snapshot
  snapshot:
    root_path: ../..
    include_paths:
      - experiments/node-acceptance/

# Receipt-driven (MLflow params, control-plane): this workspace's GPU-plane log
# blackout ate the inline-shell variant's stdout entirely (run 401340759545364).
command: |
  python experiments/node-acceptance/torch_v5_receipt.py

max_retries: 0
timeout_minutes: 15
mlflow_run_name: torch-v5-probe
