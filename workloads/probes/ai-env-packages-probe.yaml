# Probe: which ML packages does the baked-in databricks-ai env (env v5 image) actually have?
# Decides whether workloads like XGBoost work via the AI-env interpreter or need vendored wheels.
# Built from proven shapes only: $AIPY -c one-liners (torch-v5-probe) + default-python
# heredoc param logging (cli-egress-probe). First heredoc version failed 2x log-less.
experiment_name: air-lab-env-diagnostics

environment:
  version: "5"
  dependencies: []

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

command: |
  set +e
  AIPY=/opt/databricks-environments/databricks-ai/bin/python
  $AIPY -c "
  import importlib, json
  r = {}
  for p in ['torch','xgboost','sklearn','transformers','lightgbm','peft','datasets','mlflow','pandas','numpy']:
      try:
          r[p] = getattr(importlib.import_module(p), '__version__', 'present')
      except Exception:
          r[p] = 'MISSING'
  print(json.dumps(r))
  open('/tmp/ai_env_pkgs.json','w').write(json.dumps(r))
  " || echo '{"ai_env":"interpreter missing"}' > /tmp/ai_env_pkgs.json
  cat /tmp/ai_env_pkgs.json
  python - <<'PYEOF'
  import json, os, signal
  r = json.load(open('/tmp/ai_env_pkgs.json'))
  for k, v in r.items():
      print(f"RESULT ai_env.{k}={v}", flush=True)
  run_id = os.environ.get("MLFLOW_RUN_ID")
  if run_id:
      signal.alarm(120)
      try:
          import mlflow
          mlflow.start_run(run_id=run_id)
          mlflow.log_params({f"ai_env_{k}": str(v)[:400] for k, v in r.items()})
          mlflow.end_run()
      finally:
          signal.alarm(0)
  PYEOF
  exit 0

max_retries: 0
timeout_minutes: 15
mlflow_run_name: ai-env-packages-probe
