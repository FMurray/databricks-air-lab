experiment_name: air-lab-snapshot-python-probe
environment:
  version: "4"
  dependencies: []
compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10
code_source:
  type: snapshot
  snapshot:
    root_path: ../..
    include_paths:
      - experiments/node-acceptance/
command: python -c "import os; p=os.environ['CODE_SOURCE_PATH']; print('RESULT snapshot_listing=', os.listdir(p))"
max_retries: 0
timeout_minutes: 12
mlflow_run_name: snapshot-python-probe
