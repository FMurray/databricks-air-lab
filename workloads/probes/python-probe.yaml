# Does python + torch + CUDA work at all on this workspace/env? One-liner sanity check.
experiment_name: air-lab-env-diagnostics
environment:
  version: "5"   # v4 job-plane egress broken on hardened ws — see docs/06
  dependencies: []
compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10
command: python -c "import torch; assert torch.cuda.is_available(); print('RESULT python_gpu=OK', torch.cuda.get_device_name(0))"
max_retries: 0
timeout_minutes: 15
mlflow_run_name: python-probe
