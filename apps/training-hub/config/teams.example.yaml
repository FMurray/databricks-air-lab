# Copy to teams.yaml (gitignored) and fill in real teams, member emails, and node quotas.
# Quotas are declarative — the platform doesn't enforce them; the hub surfaces usage against them.

reservation:
  total_nodes: 20
  gpus_per_node: 8
  accelerator_type: GPU_8xH100
  region: us-east-1

teams:
  - name: offers
    quota_nodes: 8
    members:
      - alice@example.com
      - bob@example.com
  - name: risk
    quota_nodes: 4
    members:
      - carol@example.com
  - name: platform
    quota_nodes: 2
    members:
      - dave@example.com
