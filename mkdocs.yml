site_name: Databricks AIR Lab
site_description: Verified knowledge and utilities for Databricks AIR (serverless GPU training)
docs_dir: docs
site_dir: .mkdocs-site

# docs/private/ is customer-specific and local-only (gitignored) — never serve or build it.
exclude_docs: |
  private/

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - tables

nav:
  - Start here: index.md
  - AIR feature surface: 01-air-feature-surface.md
  - Workload × AIR fit matrix: 03-workload-matrix.md
  - Open questions: 04-open-questions.md
  - Logging & observability: 05-logging-observability.md
